# 隐患识别后端 Docker Compose 部署
# 用法：先准备 .env（复制 .env.example），再执行 docker compose up -d --build
# 详情见 DEPLOY_DOCKER.md

services:
  hazard-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: hazard-identification:latest
    container_name: hazard-identification
    restart: unless-stopped
    ports:
      - "8787:8787"
    env_file:
      # .env 不存在时也不报错：缺的密钥按 config.py 默认值处理（识别功能不可用，仅演示数据可用）
      - path: .env
        required: false
    environment:
      - HAZARD_RUNTIME_DIR=/app/data
      - TZ=Asia/Shanghai
    volumes:
      # 上传图片、分析结果落盘到命名卷，容器重建不丢数据
      - hazard-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  hazard-data: